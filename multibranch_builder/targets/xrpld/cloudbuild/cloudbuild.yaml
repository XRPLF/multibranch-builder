# Build xrpld from a branch (+ the DatagramMonitor instrumentation) on Cloud Build,
# matching rippled CI so conan DOWNLOADS the prebuilt deps (no recompiling boost/rocksdb).
# The datagram commit is fetched + merged inside the build (public, read-only).
#
# Run: multibranch-builder build --src <github-url> [--datagram <github-url>] ...

substitutions:
  _REPO: "https://github.com/XRPLF/rippled.git"
  _BRANCH: "develop"
  _DATAGRAM_REPO: ""   # e.g. https://github.com/<fork>/rippled.git
  _DATAGRAM_REF: ""    # e.g. the datagram branch/commit
  _AR: "us-central1-docker.pkg.dev/xrplf-perf-network/xrpld"
  _TAG: "dev"
  _FORCE_SUPPORTED: "OFF"
  # ON skips the strip of xrpld and validator-keys.
  _SYMBOLS: "OFF"
  # Resolved per-build from the branch's strategy-matrix; the default only applies
  # when that lookup fails. A stale pin fails the build on missing toolchains.
  _CI_IMAGE: "ghcr.io/xrplf/xrpld/nix-ubuntu:sha-2e25435"
  # The compiler cache: one tarball per CI image tag and build type in this bucket.
  _CCACHE_BUCKET: "xrplf-perf-network-xrpld-ccache"
  _CCACHE_KEY: "none/Release"

options:
  # Machine via submit flags: --machine-type (default pool) or --worker-pool + --region.
  logging: CLOUD_LOGGING_ONLY

timeout: "3600s"

steps:
  - id: ccache-restore
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p ccache
        if gcloud storage cp gs://${_CCACHE_BUCKET}/${_CCACHE_KEY}.tar.gz ccache.tar.gz; then
          tar -xzf ccache.tar.gz -C ccache && echo "ccache restored from ${_CCACHE_KEY}" || {
            rm -rf ccache; mkdir -p ccache; echo "ccache object for ${_CCACHE_KEY} unreadable: cold build"
          }
        else
          echo "no ccache object for ${_CCACHE_KEY}: cold build"
        fi

  - id: xrpld-build-stage
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - build
      - -t
      - ${_AR}/xrpld-build:${_TAG}
      - -f
      - xrpld.dockerfile
      - --build-arg
      - REPO=${_REPO}
      - --build-arg
      - BRANCH=${_BRANCH}
      - --build-arg
      - DATAGRAM_REPO=${_DATAGRAM_REPO}
      - --build-arg
      - DATAGRAM_REF=${_DATAGRAM_REF}
      - --build-arg
      - FORCE_SUPPORTED=${_FORCE_SUPPORTED}
      - --build-arg
      - SYMBOLS=${_SYMBOLS}
      - --build-arg
      - CI_IMAGE=${_CI_IMAGE}
      - .

  - id: xrpld-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_AR}/xrpld:${_TAG}
      - -f
      - xrpld.dockerfile
      - --build-arg
      - REPO=${_REPO}
      - --build-arg
      - BRANCH=${_BRANCH}
      - --build-arg
      - DATAGRAM_REPO=${_DATAGRAM_REPO}
      - --build-arg
      - DATAGRAM_REF=${_DATAGRAM_REF}
      - --build-arg
      - FORCE_SUPPORTED=${_FORCE_SUPPORTED}
      - --build-arg
      - SYMBOLS=${_SYMBOLS}
      - --build-arg
      - CI_IMAGE=${_CI_IMAGE}
      - .

  - id: ccache-pack
    allowFailure: true
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        id=$$(docker create ${_AR}/xrpld-build:${_TAG})
        mkdir -p ccache-out
        docker cp $$id:/ccache/. ccache-out
        tar -czf ccache-out.tar.gz -C ccache-out .

  - id: ccache-save
    allowFailure: true
    name: gcr.io/cloud-builders/gcloud
    args: ["storage", "cp", "ccache-out.tar.gz", "gs://${_CCACHE_BUCKET}/${_CCACHE_KEY}.tar.gz"]

images:
  - ${_AR}/xrpld:${_TAG}
