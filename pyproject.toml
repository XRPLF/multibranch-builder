[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multibranch-builder"
version = "0.1.0"
description = "Compose a multi-branch tree for an XRPLF repository, build it, push it GPG-signed."
readme = "README.md"
requires-python = ">=3.11"

dependencies = ["requests>=2.31"]
[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
multibranch-builder = "multibranch_builder.cli:main"

[tool.setuptools.packages.find]
include = ["multibranch_builder*"]

[tool.setuptools.package-data]
"multibranch_builder.targets.xrpld" = ["merge.md", "cloudbuild/*"]
"multibranch_builder.targets.xrpl_js" = ["merge.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
