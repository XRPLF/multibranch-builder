[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrpld-compose"
version = "0.1.0"
description = "Compose a multi-branch xrpld tree, build it on Cloud Build, push it GPG-signed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
xrpld-compose = "xrpld_compose.cli:main"

[tool.setuptools.packages.find]
include = ["xrpld_compose*"]

[tool.setuptools.package-data]
xrpld_compose = ["merge.md", "cloudbuild/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
